# nginx server block for the storefront domain. ERPNext keeps its own server block
# (generated by `bench setup nginx`) on its own domain, e.g. erp.lamsa.ly.
# Install: copy to /etc/nginx/conf.d/lamsa.conf, replace lamsa.ly, then `nginx -t && systemctl reload nginx`.
# TLS: `certbot --nginx -d lamsa.ly -d www.lamsa.ly`

upstream lamsa_storefront {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name lamsa.ly www.lamsa.ly;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/csv;

    # Next.js static assets are immutable
    location /_next/static/ {
        proxy_pass http://lamsa_storefront;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://lamsa_storefront;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # the storefront rate-limits and forwards this IP to ERPNext
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ERPNext's revalidation webhook calls 127.0.0.1:3000 directly; block it from outside
    location = /api/revalidate {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://lamsa_storefront;
    }
}
