<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>{{ title }}</title>
	<style>
		:root { --rose: #9e5663; --rose-50: #fbf4f5; --line: #eee4e0; --ink: #3a2e31; --muted: #7d6d71; --cream: #fbf8f4; --ok: #3f7d5c; --warn: #b7791f; }
		* { box-sizing: border-box; }
		body { margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: var(--cream); color: var(--ink); }
		header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
		header h1 { margin: 0; font-size: 1.15rem; color: var(--rose); }
		main { padding: 12px; max-width: 640px; margin: 0 auto; }
		.cash { background: var(--rose-50); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; }
		.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
		.row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
		.muted { color: var(--muted); font-size: .9rem; }
		.badge { font-size: .75rem; padding: 3px 10px; border-radius: 99px; background: #eee; }
		.badge.Confirmed { background: #ede4f7; color: #5b3a8a; } .badge.Out { background: #fdf0dc; color: var(--warn); }
		.badge.Delivered { background: #e3f1e9; color: var(--ok); }
		.gift { background: #f6eedf; border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: .9rem; }
		.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
		button, a.btn { flex: 1; min-height: 46px; border-radius: 12px; border: 0; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
		.primary { background: var(--rose); color: #fff; } .ok { background: var(--ok); color: #fff; }
		.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
		input { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; font-size: 1rem; }
		.empty { text-align: center; padding: 40px 0; color: var(--muted); }
		.toast { position: fixed; bottom: 16px; inset-inline: 16px; background: var(--ink); color: #fff; padding: 12px; border-radius: 12px; display: none; }
	</style>
</head>
<body>
	{% block content %}{% endblock %}
	<script>window.lamsaCsrf = {{ (csrf_token or '') | tojson }};</script>
</body>
</html>
